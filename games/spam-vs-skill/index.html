<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Spam vs Skill 双人同屏</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}body{display:flex;justify-content:center;min-height:100vh}#app{width:min(100%,760px);padding:8px;display:flex;flex-direction:column;gap:8px}.top,.foot{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}.score{font-size:18px;font-weight:800;display:flex;align-items:center;gap:7px}.dot{width:14px;height:14px;border-radius:50%}.r{background:#ef4444}.b{background:#3b82f6}.mid{flex:1;text-align:center}.turn{font-weight:800}.hint{font-size:12px;color:#7c8799;margin-top:2px}.top button{border:0;background:#eef2f7;border-radius:12px;padding:10px 13px;font-weight:700;color:#213047}.stage{position:relative;background:#fff;border:1px solid #e3e8ef;border-radius:18px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:9/15;background:#fbfcfe;touch-action:none}.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.9);color:#fff;padding:12px 18px;border-radius:14px;font-weight:900;font-size:20px;opacity:0;pointer-events:none;transition:.2s}.banner.show{opacity:1}.foot{font-size:12px;line-height:1.45;color:#5d6878}.foot b{color:#202939}@media(max-width:420px){#app{padding:5px;gap:5px}.top,.foot{padding:8px;border-radius:13px}.hint{display:none}.score{font-size:16px}.stage{border-radius:14px}}</style></head><body><div id="app"><div class="top"><div class="score"><span class="dot r"></span><span id="rs">0</span></div><div class="mid"><div class="turn" id="turn">红方回合</div><div class="hint" id="hint">拖住红球向后拉，松手弹射</div></div><div class="score"><span id="bs">0</span><span class="dot b"></span></div><button id="restart">重开</button></div><div class="stage"><canvas id="c" width="720" height="1200"></canvas><div id="banner" class="banner">GOAL!</div></div><div class="foot"><div><b>玩法：</b>两个人在同一块屏幕轮流操作。红方进上门，蓝方进下门。拖动自己的球反方向蓄力，松手弹射。先到 5 分获胜。</div></div></div><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),rs=document.getElementById('rs'),bs=document.getElementById('bs'),tt=document.getElementById('turn'),hint=document.getElementById('hint'),banner=document.getElementById('banner'),restart=document.getElementById('restart');const W=720,H=1200,R=24,G=250,maxPull=180,launch=.065,fric=.991,stop=.11;let turn='red',waiting=false,over=false,drag=false,pid=null,dp=null,last=performance.now(),score={red:0,blue:0};const balls={red:{x:360,y:1035,vx:0,vy:0,col:'#ef4444'},blue:{x:360,y:165,vx:0,vy:0,col:'#3b82f6'}};const obs=[{x1:410,y1:405,x2:575,y2:405},{x1:245,y1:735,x2:565,y2:735},{x1:405,y1:650,x2:405,y2:810},{x1:565,y1:735,x2:565,y2:920},{x1:150,y1:520,x2:295,y2:520}];function hud(){if(over)return;const n=turn==='red'?'红方':'蓝方';tt.textContent=waiting?n+'出手中…':n+'回合';hint.textContent=waiting?'等球停下后自动换人':'拖住'+(turn==='red'?'红':'蓝')+'球向后拉，松手弹射'}function scores(){rs.textContent=score.red;bs.textContent=score.blue}function msg(t,ms=900){banner.textContent=t;banner.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>banner.classList.remove('show'),ms)}function resetRound(scored){Object.assign(balls.red,{x:360,y:1035,vx:0,vy:0});Object.assign(balls.blue,{x:360,y:165,vx:0,vy:0});waiting=drag=false;pid=null;dp=null;if(scored)turn=scored==='red'?'blue':'red';hud()}function reset(){score={red:0,blue:0};turn='red';waiting=over=false;scores();resetRound();msg('双人开局',700)}restart.addEventListener('click',reset);function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}c.addEventListener('pointerdown',e=>{if(over||waiting||pid!==null)return;const p=pt(e),b=balls[turn];if(d(p,b)<=R*2){pid=e.pointerId;drag=true;dp=p;c.setPointerCapture?.(pid);e.preventDefault()}});c.addEventListener('pointermove',e=>{if(drag&&e.pointerId===pid){dp=pt(e);e.preventDefault()}});function release(e){if(!drag||e.pointerId!==pid)return;const p=pt(e),b=balls[turn];let dx=b.x-p.x,dy=b.y-p.y,m=Math.hypot(dx,dy);if(m>maxPull){dx*=maxPull/m;dy*=maxPull/m;m=maxPull}if(m>12){b.vx=dx*launch;b.vy=dy*launch;waiting=true;hud()}drag=false;pid=null;dp=null;e.preventDefault()}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',e=>{if(e.pointerId===pid){drag=false;pid=null;dp=null}});function cp(px,py,s){const vx=s.x2-s.x1,vy=s.y2-s.y1,wx=px-s.x1,wy=py-s.y1,q=vx*vx+vy*vy;let t=q?(wx*vx+wy*vy)/q:0;t=Math.max(0,Math.min(1,t));return{x:s.x1+t*vx,y:s.y1+t*vy}}function seg(b,s){const q=cp(b.x,b.y,s);let nx=b.x-q.x,ny=b.y-q.y,m=Math.hypot(nx,ny),min=R+15;if(m<min){if(m<.001){const sx=s.x2-s.x1,sy=s.y2-s.y1;nx=-sy;ny=sx;m=Math.hypot(nx,ny)||1}nx/=m;ny/=m;const push=min-m;b.x+=nx*push;b.y+=ny*push;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.82*vn*nx;b.vy-=1.82*vn*ny}}}function ballHit(a,b){let dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy),min=R*2;if(m>0&&m<min){const nx=dx/m,ny=dy/m,o=min-m;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,sep=rvx*nx+rvy*ny;if(sep<0){const imp=-sep*.92;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}}}const inG=x=>x>W/2-G/2&&x<W/2+G/2;function goal(w){score[w]++;scores();if(score[w]>=5){over=true;waiting=false;tt.textContent=(w==='red'?'红方':'蓝方')+'获胜！';hint.textContent='点重开再来一局';msg((w==='red'?'红方':'蓝方')+'胜利！',1800);balls.red.vx=balls.red.vy=balls.blue.vx=balls.blue.vy=0;return}msg((w==='red'?'红':'蓝')+'方进球！');setTimeout(()=>resetRound(w),650)}function step(dt){if(over)return;const sc=Math.min(2.2,dt/16.6667);for(const k of ['red','blue']){const b=balls[k];b.x+=b.vx*sc;b.y+=b.vy*sc;b.vx*=Math.pow(fric,sc);b.vy*=Math.pow(fric,sc);if(Math.hypot(b.vx,b.vy)<stop){b.vx=b.vy=0}if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.88}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)*.88}if(b.y<R){if(!(k==='red'&&inG(b.x))){b.y=R;b.vy=Math.abs(b.vy)*.88}}if(b.y>H-R){if(!(k==='blue'&&inG(b.x))){b.y=H-R;b.vy=-Math.abs(b.vy)*.88}}obs.forEach(s=>seg(b,s))}ballHit(balls.red,balls.blue);if(balls.red.y<R+7&&inG(balls.red.x)){goal('red');return}if(balls.blue.y>H-R-7&&inG(balls.blue.x)){goal('blue');return}if(waiting&&balls.red.vx===0&&balls.red.vy===0&&balls.blue.vx===0&&balls.blue.vy===0){waiting=false;turn=turn==='red'?'blue':'red';hud()}}function grid(){x.save();x.strokeStyle='#edf1f6';x.lineWidth=2;for(let i=0;i<=W;i+=72){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<=H;j+=72){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}x.restore()}function goals(){x.save();x.fillStyle='rgba(27,185,129,.12)';x.fillRect(0,0,W,70);x.fillRect(0,H-70,W,70);x.strokeStyle='#1bb981';x.lineWidth=8;x.setLineDash([36,14]);x.beginPath();x.moveTo(235,12);x.lineTo(485,12);x.stroke();x.beginPath();x.moveTo(235,H-12);x.lineTo(485,H-12);x.stroke();x.setLineDash([]);x.fillStyle='#159568';x.font='800 24px system-ui';x.textAlign='center';x.fillText('▲ RED GOAL ▲',360,49);x.fillText('▼ BLUE GOAL ▼',360,H-28);x.restore()}function obstacles(){x.save();x.lineCap='round';for(const s of obs){x.strokeStyle='rgba(46,106,210,.16)';x.lineWidth=38;x.beginPath();x.moveTo(s.x1,s.y1);x.lineTo(s.x2,s.y2);x.stroke();x.strokeStyle='#3b82f6';x.lineWidth=26;x.beginPath();x.moveTo(s.x1,s.y1);x.lineTo(s.x2,s.y2);x.stroke()}x.restore()}function drawBall(b,k){x.save();const g=x.createRadialGradient(b.x-8,b.y-10,4,b.x,b.y,R+10);g.addColorStop(0,'#fff');g.addColorStop(.18,b.col);g.addColorStop(1,k==='red'?'#b91c1c':'#1d4ed8');x.shadowColor=k==='red'?'rgba(239,68,68,.45)':'rgba(59,130,246,.45)';x.shadowBlur=18;x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,R,0,Math.PI*2);x.fill();x.lineWidth=4;x.strokeStyle=k==='red'?'#991b1b':'#1e40af';x.stroke();x.restore()}function aim(){if(!drag||!dp)return;const b=balls[turn];let dx=dp.x-b.x,dy=dp.y-b.y,m=Math.hypot(dx,dy);if(m>maxPull){dx*=maxPull/m;dy*=maxPull/m;m=maxPull}x.save();x.strokeStyle=turn==='red'?'rgba(239,68,68,.8)':'rgba(59,130,246,.8)';x.lineWidth=8;x.setLineDash([16,12]);x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+dx,b.y+dy);x.stroke();x.setLineDash([]);x.strokeStyle='rgba(23,32,51,.25)';x.lineWidth=14;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-dx*1.35,b.y-dy*1.35);x.stroke();x.restore()}function render(){x.clearRect(0,0,W,H);x.fillStyle='#fbfcfe';x.fillRect(0,0,W,H);grid();goals();obstacles();drawBall(balls.blue,'blue');drawBall(balls.red,'red');aim();if(!waiting&&!over){const b=balls[turn];x.save();x.strokeStyle=turn==='red'?'rgba(239,68,68,.35)':'rgba(59,130,246,.35)';x.lineWidth=6;x.beginPath();x.arc(b.x,b.y,R+14,0,Math.PI*2);x.stroke();x.restore()}}function loop(now){const dt=Math.min(34,now-last);last=now;step(dt);render();requestAnimationFrame(loop)}scores();hud();requestAnimationFrame(loop)})();</script></body></html>
